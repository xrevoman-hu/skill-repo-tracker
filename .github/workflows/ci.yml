name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1
  VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha }}
  ARCHITECTURE_BASE_REF: ${{ github.event.pull_request.base.sha }}
  COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha }}

jobs:
  verify:
    name: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked dependency and Cargo overrides
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              .npmrc|rust-toolchain|npm-shrinkwrap.json|*/npm-shrinkwrap.json|.cargo|.cargo/*|*/.cargo|*/.cargo/*)
                echo "forbidden tracked dependency/toolchain override: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)
      - name: Reject repository-local toolchain overrides
        run: |
          set -euo pipefail
          for path in .npmrc .cargo rust-toolchain; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "forbidden repository-local toolchain override: $path" >&2
              exit 1
            fi
          done
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm dependencies from the official registry
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Set up pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - name: Validate gate invocation before npm lifecycle execution
        run: node scripts/governance.mjs boundaries
      - name: Enforce PR learning evidence
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-evidence.mjs
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: Run the deterministic repository gate
        run: npm run verify
      - name: Run browser acceptance with DemoAppService
        run: npm run test:e2e

  coverage:
    name: coverage
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked dependency and Cargo overrides
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              .npmrc|rust-toolchain|npm-shrinkwrap.json|*/npm-shrinkwrap.json|.cargo|.cargo/*|*/.cargo|*/.cargo/*)
                echo "forbidden tracked dependency/toolchain override: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)
      - name: Reject repository-local toolchain overrides
        run: |
          set -euo pipefail
          for path in .npmrc .cargo rust-toolchain; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "forbidden repository-local toolchain override: $path" >&2
              exit 1
            fi
          done
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview
          rustup default 1.95.0
      - name: Install npm dependencies from the official registry
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Validate gate invocation before npm lifecycle execution
        run: node scripts/governance.mjs boundaries
      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.0
      - name: Enforce frontend and Rust coverage
        run: npm run coverage:check

  msrv:
    name: msrv
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject tracked dependency and Cargo overrides
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              .npmrc|rust-toolchain|npm-shrinkwrap.json|*/npm-shrinkwrap.json|.cargo|.cargo/*|*/.cargo|*/.cargo/*)
                echo "forbidden tracked dependency/toolchain override: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)
      - name: Reject repository-local toolchain overrides
        run: |
          set -euo pipefail
          for path in .npmrc .cargo rust-toolchain; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "forbidden repository-local toolchain override: $path" >&2
              exit 1
            fi
          done
      - name: Install the declared minimum Rust version
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Compile every target at MSRV
        run: cargo +1.88.0 check --locked --all-targets --all-features --manifest-path src-tauri/Cargo.toml
