name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  PUSH_BEFORE: ${{ github.event.before }}

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      validated_base: ${{ steps.resolve.outputs.validated_base }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node.js without package cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve the cumulative successful main ancestor
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/main-push-evidence.mjs baseline
  verify:
    name: verify
    needs: baseline
    env:
      VERIFY_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
      ARCHITECTURE_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
      COVERAGE_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the shared cumulative baseline
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]
          test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
          [[ "$VERIFY_BASE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$VERIFY_BASE_REF" != 0000000000000000000000000000000000000000
          test "$VERIFY_BASE_REF" != "$GITHUB_SHA"
          test "$VERIFY_BASE_REF" = "$ARCHITECTURE_BASE_REF"
          test "$VERIFY_BASE_REF" = "$COVERAGE_BASE_REF"
          git cat-file -e "${VERIFY_BASE_REF}^{commit}"
          git merge-base --is-ancestor "$VERIFY_BASE_REF" "$PUSH_BEFORE"
          git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA"
      - name: Reject tracked dependency and Cargo overrides
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              .npmrc|rust-toolchain|npm-shrinkwrap.json|*/npm-shrinkwrap.json|.cargo|.cargo/*|*/.cargo|*/.cargo/*)
                echo "forbidden tracked dependency/toolchain override: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)
      - name: Reject repository-local toolchain overrides
        run: |
          set -euo pipefail
          for path in .npmrc .cargo rust-toolchain; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "forbidden repository-local toolchain override: $path" >&2
              exit 1
            fi
          done
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm dependencies from the official registry
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Set up pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - name: Validate gate invocation before npm lifecycle execution
        run: node scripts/governance.mjs boundaries
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: Run the deterministic repository gate
        run: npm run verify
      - name: Run browser acceptance with DemoAppService
        run: npm run test:e2e

  coverage:
    name: coverage
    needs: baseline
    env:
      VERIFY_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
      ARCHITECTURE_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
      COVERAGE_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the shared cumulative baseline
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]
          test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
          [[ "$VERIFY_BASE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$VERIFY_BASE_REF" != 0000000000000000000000000000000000000000
          test "$VERIFY_BASE_REF" != "$GITHUB_SHA"
          test "$VERIFY_BASE_REF" = "$ARCHITECTURE_BASE_REF"
          test "$VERIFY_BASE_REF" = "$COVERAGE_BASE_REF"
          git cat-file -e "${VERIFY_BASE_REF}^{commit}"
          git merge-base --is-ancestor "$VERIFY_BASE_REF" "$PUSH_BEFORE"
          git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA"
      - name: Reject tracked dependency and Cargo overrides
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              .npmrc|rust-toolchain|npm-shrinkwrap.json|*/npm-shrinkwrap.json|.cargo|.cargo/*|*/.cargo|*/.cargo/*)
                echo "forbidden tracked dependency/toolchain override: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)
      - name: Reject repository-local toolchain overrides
        run: |
          set -euo pipefail
          for path in .npmrc .cargo rust-toolchain; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "forbidden repository-local toolchain override: $path" >&2
              exit 1
            fi
          done
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview
          rustup default 1.95.0
      - name: Install npm dependencies from the official registry
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Validate gate invocation before npm lifecycle execution
        run: node scripts/governance.mjs boundaries
      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.0
      - name: Enforce frontend and Rust coverage
        run: npm run coverage:check

  msrv:
    name: msrv
    needs: baseline
    env:
      VERIFY_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
      ARCHITECTURE_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
      COVERAGE_BASE_REF: ${{ needs.baseline.outputs.validated_base }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the shared cumulative baseline
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]
          test "$PUSH_BEFORE" != 0000000000000000000000000000000000000000
          [[ "$VERIFY_BASE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$VERIFY_BASE_REF" != 0000000000000000000000000000000000000000
          test "$VERIFY_BASE_REF" != "$GITHUB_SHA"
          test "$VERIFY_BASE_REF" = "$ARCHITECTURE_BASE_REF"
          test "$VERIFY_BASE_REF" = "$COVERAGE_BASE_REF"
          git cat-file -e "${VERIFY_BASE_REF}^{commit}"
          git merge-base --is-ancestor "$VERIFY_BASE_REF" "$PUSH_BEFORE"
          git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA"
      - name: Reject tracked dependency and Cargo overrides
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              .npmrc|rust-toolchain|npm-shrinkwrap.json|*/npm-shrinkwrap.json|.cargo|.cargo/*|*/.cargo|*/.cargo/*)
                echo "forbidden tracked dependency/toolchain override: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)
      - name: Reject repository-local toolchain overrides
        run: |
          set -euo pipefail
          for path in .npmrc .cargo rust-toolchain; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "forbidden repository-local toolchain override: $path" >&2
              exit 1
            fi
          done
      - name: Set up Node.js for native preparation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install the declared minimum Rust version
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Compile every target at MSRV
        run: node scripts/native-command.mjs check-msrv
