name: Release gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version (for example 1.2.2)
        required: true
        type: string
      phase:
        description: Verification phase
        required: true
        default: remote
        type: choice
        options:
          - local
          - remote
      releaseManifest:
        description: Operator-carried artifact field token; required for remote and not proof of local-gate provenance
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-gate-${{ inputs.version }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PHASE: ${{ inputs.phase }}
      RELEASE_MANIFEST: ${{ inputs.releaseManifest }}
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.88.0 --profile minimal
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview
          rustup default 1.95.0
      - name: Install npm dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Install local-phase coverage and browser tools
        if: inputs.phase == 'local'
        run: |
          cargo install cargo-llvm-cov --locked --version 0.9.0
          npx playwright install chromium
      - name: Run the explicit release verification lane
        run: npm run release:verify -- --lane adhoc --version "$RELEASE_VERSION" --phase "$RELEASE_PHASE" --manifest-token "$RELEASE_MANIFEST"
