[package]
name = "skill-repo-tracker"
version = "1.4.1"
description = "Local-first GitHub repository and Skill update manager"
authors = ["Skill Repo Tracker"]
license = "MIT"
repository = "https://github.com/xrevoman-hu/skill-repo-tracker"
homepage = "https://github.com/xrevoman-hu/skill-repo-tracker"
readme = "../README.md"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "skill_repo_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hex = "0.4"
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
opener = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["backup", "bundled", "chrono", "sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time"] }
urlencoding = "2"
unicode-normalization = "0.1"
walkdir = "2"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
security-framework = "3.7"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
